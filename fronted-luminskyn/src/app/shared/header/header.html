<header class="header">

    <div class="header__top">

        <button class="header__toggle">☰</button>

        <!-- 🔧 LOGO -->
        <a routerLink="/" class="header__brand">
            <img class="header__logo" src="assets/img/logo.png" alt="Logo de LuminSkyn">
            <span class="header__title">LuminSkyn</span>
        </a>

        <!-- 🔧 ICONOS -->
        <div class="header__actions">

            <a routerLink="/login" class="header__icon" aria-label="Login">
                👤
            </a>

            <a routerLink="/carrito" class="header__icon" aria-label="Carrito">
                🛒 
                <span class="header__cart-count">
                    {{ cantidadCarrito }}
                </span>
            </a>

        </div>
    </div>

    <!-- 🔧 MENÚ -->
    <nav class="header__nav" aria-label="Navegación principal">
        <ul class="header__menu">

            <li class="header__item">
                <a class="header__link" routerLink="/">Inicio</a>
            </li>

            <li class="header__item">
                <a class="header__link" href="#product-new">Nuevo</a>
            </li>

            <li class="header__item">
                <a class="header__link" routerLink="/tienda">Cuidado Facial</a>
            </li>

            <li class="header__item">
                <a class="header__link" routerLink="/tienda">Rutina</a>
            </li>

            <li class="header__item">
                <a class="header__link" routerLink="/tienda">Tipos de Piel</a>
            </li>

            <li class="header__item">
                <a class="header__link" routerLink="/tienda">Accesorios</a>
            </li>

            <li class="header__item">
                <a class="header__link" href="#product-offers">Ofertas</a>
            </li>

        </ul>
    </nav>

</header>
